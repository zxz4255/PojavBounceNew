#
# Android/PojavLauncher/ZalithLauncher specific Gradle properties
# Use: gradle build -Dgradle.properties.file=gradle-android.properties
# Or copy this file over gradle.properties for Android builds
#

# Build settings optimized for Android
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true

# Reduce memory usage for Android cross-compilation
org.gradle.jvmargs=-Xms512m -Xmx2048m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Mod Properties
mod_version=0.39.0-android
maven_group=net.ccbluex
archives_base_name=liquidbounce-android

# Android-specific build flag
build.target=android
