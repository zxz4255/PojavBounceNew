name: Cleanup Failed Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-runs.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            let page = 1;
            let allRuns = [];

            // 1. 手动翻页拉取所有记录（更安全，避免 undefined 混入）
            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 100, page
              });
              
              const data = response.data;
              // 防御性检查：如果没数据或数据为空，跳出循环
              if (!data || !data.workflow_runs || data.workflow_runs.length === 0) {
                break;
              }
              
              allRuns.push(...data.workflow_runs);
              
              // 如果返回数量少于每页最大数量，说明已经是最后一页了
              if (data.workflow_runs.length < 100) {
                break;
              }
              page++;
            }

            core.info(`总共拉取到 ${allRuns.length} 个运行记录`);

            // 2. 打印前 5 个记录的真实状态，让你看清红叉到底是什么 conclusion
            allRuns.slice(0, 5).forEach(r => 
              core.info(`ID: ${r.id} | 名称: ${r.name} | 状态: ${r.status} | 结论: ${r.conclusion}`)
            );

            // 3. 严格过滤：只删除结论为 'failure' 的记录
            // 绝对不碰 success，同时排除当前清理任务自身，防止自己删自己
            const failed = allRuns.filter(r => 
              r && 
              r.conclusion === 'failure' && 
              r.name !== 'Cleanup Failed Runs'
            );

            core.info(`共发现 ${failed.length} 个失败的运行`);

            // 4. 逐个删除
            let deleted = 0;
            for (const run of failed) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
              } catch (err) {
                core.warning(`删除 run ${run.id} 失败: ${err.message}`);
              }
            }

            core.notice(`✅ 已删除 ${deleted} 个失败的运行（success 未被触碰）`);
