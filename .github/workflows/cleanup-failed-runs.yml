name: Cleanup Failed Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-runs.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100, status: 'completed' },
              (response) => response.data.workflow_runs   // ← 关键修复
            );

            const failed = runs.filter(r => r && r.conclusion === 'failure');
            core.info(`共发现 ${failed.length} 个失败的运行`);

            let deleted = 0;
            for (const run of failed) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
              } catch (err) {
                core.warning(`删除 run ${run.id} 失败: ${err.message}`);
              }
            }

            core.notice(`✅ 已删除 ${deleted} 个失败的运行`);
