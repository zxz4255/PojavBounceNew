name: Cleanup Failed Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-runs.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            let page = 1;
            let allRuns = [];

            // 1. 手动翻页拉取所有记录
            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 100, page
              });
              const data = response.data;
              if (!data || !data.workflow_runs || data.workflow_runs.length === 0) break;
              allRuns.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
              page++;
            }

            core.info(`总共拉取到 ${allRuns.length} 个运行记录`);

            // 2. 过滤条件：清理所有非 success 的已完成记录
            // 唯一保护对象：当前正在运行的这一次清理任务 (context.runId)
            const failed = allRuns.filter(r => 
              r && 
              r.status === 'completed' && 
              r.conclusion !== 'success' && 
              r.conclusion !== 'skipped' && 
              r.conclusion !== 'neutral' &&
              r.id !== context.runId
            );

            core.info(`共发现 ${failed.length} 个需要清理的记录`);

            // 3. 逐个删除
            let deleted = 0;
            for (const run of failed) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
              } catch (err) {
                core.warning(`删除 run ${run.id} 失败: ${err.message}`);
              }
            }

            core.notice(`✅ 本次已彻底清理 ${deleted} 个记录（success 完好无损）`);
