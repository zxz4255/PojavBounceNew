name: Cleanup Failed Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-runs.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // 1. 去掉 status 参数，拉取所有能拿到的记录
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 },
              (response) => response.data.workflow_runs
            );

            core.info(`总共拉取到 ${runs.length} 个运行记录`);

            // 2. 打印前5个记录的真实状态，看看红色的叉到底是什么 conclusion
            runs.slice(0, 5).forEach(r => 
              core.info(`ID: ${r.id} | 名称: ${r.name} | 状态: ${r.status} | 结论: ${r.conclusion}`)
            );

            // 3. 严格过滤：只删除结论为 'failure' 的记录，绝对不碰 success
            // 排除当前清理任务自身，防止自己删自己
            const failed = runs.filter(r => 
              r && 
              r.conclusion === 'failure' && 
              r.name !== 'Cleanup Failed Runs'
            );

            core.info(`共发现 ${failed.length} 个失败的运行`);

            // 4. 逐个删除
            let deleted = 0;
            for (const run of failed) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
              } catch (err) {
                core.warning(`删除 run ${run.id} 失败: ${err.message}`);
              }
            }

            core.notice(`✅ 已删除 ${deleted} 个失败的运行（success 未被触碰）`);
