name: Cleanup Failed Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-runs.yml'   # 只有 build.yml 被修改时才跑
  workflow_dispatch:                     # 也支持手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write     # 删除 workflow run 必需

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // 1. 拉取所有已完成的运行（自动分页）
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100, status: 'completed' },
              (res) => res.data.workflow_runs
            );

            const failed = runs.filter(r => r.conclusion === 'failure');
            core.info(`共发现 ${failed.length} 个失败的运行`);

            // 2. 逐个删除
            let deleted = 0;
            for (const run of failed) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
              } catch (err) {
                core.warning(`删除 run ${run.id} 失败: ${err.message}`);
              }
            }

            core.notice(`✅ 已删除 ${deleted} 个失败的运行`);
