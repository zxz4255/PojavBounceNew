name: Create Release

on:
  push:
    tags:
      - 'v*'              # 推送 v1.17 这类标签时触发

jobs:
  release:
    runs-on: ubuntu-latest
    needs: build          # 等待 build.yml 完成
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: liquidbounce
          path: ./artifacts

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
